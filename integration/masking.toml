[general]
tag_source = "comment"

[[users]]
name = "admin"
roles = ["pii_admin"]

[[users]]
name = "support"
roles = ["support"]

[[policies]]
name = "ssn"
data_type = "text"
mask = "sql"
expression = "'XXX-XX-' || right(val, 4)"

[[policies.rules]]
roles = ["pii_admin"]
mask = "none"

[[policies.rules]]
roles = ["support"]
mask = "default"
search = "raw"

[[policies]]
name = "email"
data_type = "text"
mask = "email"

[[policies.rules]]
roles = ["pii_admin"]
mask = "none"

[[masked_columns]]
schema = "masking_e2e"
name = "users"
column = "ssn"
policy = "ssn"

[[masked_columns]]
schema = "masking_e2e"
name = "users"
column = "email"
policy = "email"

# Tagged with a column comment.
[[policies]]
name = "phone"
data_type = "text"
mask = "partial"
keep_suffix = 2

[[policies.rules]]
roles = ["pii_admin"]
mask = "none"

[[policies]]
name = "secret"
data_type = "text"
mask = "null"

[[policies.rules]]
roles = ["pii_admin"]
mask = "none"

[[tags]]
name = "pii.phone"
policy = "phone"

[[tags]]
name = "secret"
policy = "secret"

[[classifiers]]
schema = "masking_e2e"
column_regex = "secret_.*"
tag = "secret"
