# The users share one Postgres role; masking depends on the PgDog user.
[[users]]
name = "masked"
database = "pgdog"
password = "pgdog"
server_user = "pgdog"
server_password = "pgdog"

[[users]]
name = "admin"
database = "pgdog"
password = "pgdog"
server_user = "pgdog"
server_password = "pgdog"

[[users]]
name = "support"
database = "pgdog"
password = "pgdog"
server_user = "pgdog"
server_password = "pgdog"

[[users]]
name = "analyst"
database = "pgdog"
password = "pgdog"
server_user = "pgdog"
server_password = "pgdog"

# Like masked (not in masking.toml), with one server connection, so its
# clients share it in a known order.
[[users]]
name = "pooled"
database = "pgdog"
password = "pgdog"
server_user = "pgdog"
server_password = "pgdog"
pool_size = 1
