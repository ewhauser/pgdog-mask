[package]
name = "pgdog-mask"
version = "0.1.0"
edition = "2024"
description = "Dynamic data masking plugin for PgDog"
publish = false

[lib]
name = "pgdog_mask"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Plugin API 0.7 (statement, mask, error and catalog hooks) lives on the fork until
# it's upstream. PgDog must be built from the same commit: plugins are only loaded
# when the plugin API version and the Rust compiler version match. The
# integration scripts read this revision to build PgDog.
pgdog-plugin = { git = "https://github.com/ewhauser/pgdog", rev = "6cc2d30c3a2689193bf09c58663a9bf48ce4e8c1" }
# Must match the pg_raw_parse PgDog uses at that revision.
pg_raw_parse = { git = "https://github.com/pgdogdev/pg_raw_parse.git", rev = "89937b1" }
arc-swap = "1"
indexmap = { version = "2.14", features = ["serde"] }
lru = "0.16"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
futures-util = "0.3"
# PgDog's catalog row types, to load catalogs in tests the way PgDog does.
pgdog-stats = { git = "https://github.com/ewhauser/pgdog", rev = "6cc2d30c3a2689193bf09c58663a9bf48ce4e8c1" }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[[bench]]
name = "overhead"
harness = false
