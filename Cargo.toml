[package]
name = "pgdog-mask"
version = "0.1.0"
edition = "2024"
description = "Dynamic data masking plugin for PgDog"
publish = false

[lib]
name = "pgdog_mask"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pgdog-mask"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "canary"
required-features = ["cli"]

[[test]]
name = "validate"
required-features = ["cli"]

[features]
default = ["plugin", "cli"]
# Build the plugin itself. Crates that build their own plugin with custom proxy
# masks (`masking_plugin!`) depend on pgdog-mask with default features off.
plugin = []
# The `pgdog-mask` command, and `schema`, which loads a catalog from Postgres.
cli = ["dep:pgdog-stats", "dep:tokio", "dep:tokio-postgres"]
# Masks for integration tests only.
test-masks = []

[dependencies]
# Plugin API 0.8 (statement, transform, error and catalog hooks) lives on the fork until
# it's upstream. PgDog must be built from the same commit: plugins are only loaded
# when the plugin API version and the Rust compiler version match. The
# integration scripts read this revision to build PgDog.
pgdog-plugin = { git = "https://github.com/ewhauser/pgdog", rev = "d3dc39ff14ca4fdb0ceac25bf69977fce50ca2be" }
# Must match the pg_raw_parse PgDog uses at that revision.
pg_raw_parse = { git = "https://github.com/pgdogdev/pg_raw_parse.git", rev = "89937b1" }
aes = "0.8"
arc-swap = "1"
fpe = "0.6"
hex = "0.4"
hmac = "0.13"
indexmap = { version = "2.14", features = ["serde"] }
lru = "0.16"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
# With `cli`. PgDog's catalog row types, to load catalogs the way PgDog does.
pgdog-stats = { git = "https://github.com/ewhauser/pgdog", rev = "d3dc39ff14ca4fdb0ceac25bf69977fce50ca2be", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tokio-postgres = { version = "0.7", optional = true }

[dev-dependencies]
futures-util = "0.3"
# Authentication for the wire-protocol client in tests/support/wire.rs.
postgres-protocol = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[[bench]]
name = "overhead"
harness = false
